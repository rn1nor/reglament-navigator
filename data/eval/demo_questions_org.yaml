# Примеры вопросов для базы организаторов (data/kb/org). Первая группа показывается на стартовом экране интерфейса.
Частые вопросы:
  - {q: "Как оформить служебную командировку?", role: staff}
  - {q: "Сколько составляют суточные при командировке по России по регламенту и по приказу о бюджете на 2026 год?", role: staff}
  - {q: "Как открыть финансовый лицевой счет для научно-исследовательской работы?", role: researcher}
  - {q: "Как согласовать и утвердить смету доходов и расходов подразделения?", role: admin}
  - {q: "Сколько длится внутренний заём и какой штраф, если не вернуть его вовремя?", role: admin}
  - {q: "Я руководитель лаборатории, нам нужен новый инженер в штат. С чего начать и сколько ждать публикации вакансии?", role: admin}
Ещё по документам базы:
  - {q: "Как забронировать Концертный зал МФТИ для мероприятия?", role: staff}
  - {q: "У меня не работает корпоративная почта, куда писать и когда ответят?", role: staff}
  - {q: "Мне 45 лет, я сотрудник МФТИ, прописан в Твери. Могу ли я заселиться в общежитие?", role: staff}
  - {q: "Как присваивается номер финансового лицевого счёта?", role: admin}
  - {q: "Как разместить сервер в центре обработки данных МФТИ?", role: staff}
Редакции и даты:
  - {q: "Как открыть финансовый лицевой счет для научно-исследовательской работы по состоянию на 2019 год?", role: researcher}
  - {q: "Что говорит приказ от 08.07.2020 № 1465-1 о внутреннем заимствовании?", role: ""}
  - {q: "Что изменил приказ № 794-1 от 28.03.2023?", role: admin}
Система должна уточнить или отказать:
  - {q: "Какой срок подачи заявки?", role: ""}
  - {q: "Как оформить командировку и какой размер повышенной стипендии?", role: staff}
  - {q: "Как оформить ежегодный оплачиваемый отпуск?", role: staff}
  - {q: "Что говорит приказ № 9999-1 от 01.01.2024 о премировании сотрудников?", role: ""}
